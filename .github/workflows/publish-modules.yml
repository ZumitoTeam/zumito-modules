name: Publish Modified Modules

on:
  push:
    branches:
      - master

jobs:
  publish-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Get modified root folders
        id: folders
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ 'NF==2 {print $1}' | sort -u > changed_folders.txt
          cat changed_folders.txt

      - name: Bump minor version and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while read folder; do
            if [ -f "$folder/package.json" ]; then
              echo "Processing $folder..."
              # Bump minor version
              node -e "const fs=require('fs');const path='$folder/package.json';const pkg=JSON.parse(fs.readFileSync(path));const [major,minor,patch]=pkg.version.split('.').map(Number);pkg.version=`${major}.${minor+1}.0`;fs.writeFileSync(path,JSON.stringify(pkg,null,2));"
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git add "$folder/package.json"
              git commit -m "ci: bump minor version for $folder"
              git push
              cd $folder
              npm publish --access public
              cd ..
            fi
          done < changed_folders.txt
