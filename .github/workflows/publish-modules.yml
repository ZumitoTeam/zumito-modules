name: Publish Modified Modules

on:
  push:
    branches:
      - main

jobs:
  publish-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Get modified root folders
        id: folders
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ 'NF==2 {print $1}' | sort -u > changed_folders.txt
          cat changed_folders.txt

      - name: Bump minor version and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while read folder; do
            if [ -f "$folder/package.json" ]; then
              echo "Processing $folder..."
              PKG_NAME=$(jq -r .name "$folder/package.json")
              CURRENT_VERSION=$(npm view "$PKG_NAME" version || echo "0.0.0")
              MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
              MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
              NEW_MINOR=$((MINOR+1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
              echo "Bumping $PKG_NAME from $CURRENT_VERSION to $NEW_VERSION"
              jq ".version=\"$NEW_VERSION\"" "$folder/package.json" > "$folder/package.json.tmp" && mv "$folder/package.json.tmp" "$folder/package.json"
              cd $folder
              npm publish --access public
              cd ..
            fi
          done < changed_folders.txt
